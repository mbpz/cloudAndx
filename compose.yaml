name: cloudandx-android16

services:
  android:
    image: cloudandx/android16-redroid:16-r1
    platform: linux/arm64
    build:
      context: .
      dockerfile: docker/redroid/Dockerfile
    privileged: true
    shm_size: 2gb
    environment:
      ANDROID_ADB_SERIAL: 127.0.0.1:5555
      DISPLAY: ":0"
      NOVNC_PORT: "6080"
      NOVNC_TLS: "true"
      VNC_PORT: "5900"
    command:
      - androidboot.redroid_width=${ANDROID_WIDTH:-1080}
      - androidboot.redroid_height=${ANDROID_HEIGHT:-1920}
      - androidboot.redroid_dpi=${ANDROID_DPI:-480}
      - androidboot.redroid_fps=${ANDROID_FPS:-60}
      - androidboot.redroid_gpu_mode=guest
    devices:
      - /dev/ashmem:/dev/ashmem
      - /dev/dma_heap/system:/dev/dma_heap/system
    volumes:
      - emulator-data:/data
      - type: bind
        source: /dev/binderfs/binder
        target: /dev/binder
      - type: bind
        source: /dev/binderfs/hwbinder
        target: /dev/hwbinder
      - type: bind
        source: /dev/binderfs/vndbinder
        target: /dev/vndbinder
    ports:
      - 127.0.0.1:${ANDROID_ADB_PORT:-5555}:5555/tcp
      - 127.0.0.1:${ANDROID_NOVNC_PORT:-6080}:6080/tcp
      - 127.0.0.1:${DEVICE_BRIDGE_PORT:-8090}:8090/tcp
    stop_grace_period: 45s
    restart: "on-failure:3"

volumes:
  emulator-data:
