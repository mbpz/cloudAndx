server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=5s;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/controller/ {
        set $controller_upstream controller:8080;
        rewrite ^/api/controller/(.*)$ /$1 break;
        proxy_pass http://$controller_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
    }

    location /api/device/ {
        set $device_upstream device-bridge:8090;
        rewrite ^/api/device/(.*)$ /$1 break;
        proxy_pass http://$device_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
